<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>QuickNotes</h1>
      <p class="subtitle">A simple notes client talking to a REST API.</p>

      <section class="load-section">
        <button id="load-btn" type="button">Load notes</button>
        <p id="status" role="status"></p>
      </section>

      <section class="list-section">
        <h2>Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </div>
  </body>
</html>
