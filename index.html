<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>QuickNotes</h1>
      <p class="subtitle">A simple notes client talking to a REST API.</p>

      <section class="load-section">
        <button id="load-btn" type="button">Load notes</button>
        <p id="status" role="status"></p>
      </section>

      <section class="form-section">
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="field">
            <label for="title-input">Title</label>
            <input type="text" id="title-input" name="title" maxlength="100" placeholder="Note title (required, max 100 characters)">
          </div>
          <div class="field">
            <label for="body-input">Body</label>
            <textarea id="body-input" name="body" placeholder="Note body (optional)"></textarea>
          </div>
          <button id="submit-btn" type="submit">Add note</button>
        </form>
      </section>

      <section class="list-section">
        <h2>Notes</h2>
        <ul id="notes-list"></ul>
      </section>
    </div>
  </body>
</html>
